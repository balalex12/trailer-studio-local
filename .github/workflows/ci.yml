name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - name: trailer.py compiles (stdlib only)
        run: python -m py_compile trailer.py
      - name: JSON files are valid
        run: |
          for f in workflows/*.json examples/*.json; do
            python -m json.tool "$f" > /dev/null || exit 1
          done
