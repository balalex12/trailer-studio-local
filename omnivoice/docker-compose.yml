services:
  omnivoice:
    image: ghcr.io/debpalash/omnivoice-studio:stable
    container_name: omnivoice
    ports:
      # API compatible con OpenAI en localhost:3900 (solo local, no expuesto a la LAN)
      - "127.0.0.1:3900:3900"
    volumes:
      - omnivoice-data:/app/omnivoice_data
      - omnivoice-hf:/root/.cache/huggingface
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # GPU: el modo CPU tiene un bug/deadlock. Probamos GPU. ComfyUI se para
    # temporalmente para que OmniVoice disponga de los 6 GB sin competir.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  omnivoice-data:
  omnivoice-hf:
